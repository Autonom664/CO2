    class_bit: protected_nature_s3
    geometry: polygon
  protected_reserves:
    file: protected_areas.gpkg
    layer: fredninger
    cost: protected_nature
    class_bit: protected_reserves
    geometry: polygon

combine_groups:
  protected_areas:
    members: [natura2000, protected_nature]
    rule: max

discount_classes:
  - marine_cable_corridor

parallel_corridor:
  enabled: true
  inner_distance_m: 50
  outer_distance_m: 300
  factor: 0.8
  # Add OSM way IDs here when running validation that must not reuse those ways.
  exclude_osm_ids: []
  assets:
    - file: phase_a_infrastructure.gpkg
      layer: power_lines
    - file: phase_a_infrastructure.gpkg
      layer: pipelines

