# Initial subjective scoring assumptions; tune these before interpreting routes.
# Values are relative cell costs, not monetary estimates.
grid:
  crs: EPSG:25832
  resolution_m: 100
  cost_reference_resolution_m: 250
  combine_rule: additive
  nodata: -9999

routing:
  max_snap_distance_m: 2000
  offshore_corridor_half_width_m: 10000

web:
  display_resolution_m: 100
  route_simplify_m: 25

barriers:
  - building_barrier
  - protected_barrier

costs:
  open_land: 1
  open_sea: 2
  drinking_water_osd: 4
  drinking_water_od: 2
  road_major: 4
  road_minor: 2
  railway_crossing: 5
  forest: 6
  urban_area: 8
  building_barrier: 10
  natura2000: 9
  protected_nature: 8
  watercourse_crossing: 4
  lake: 7
  wetland: 7
  groundwater_catchment: 3
  ancient_monument_protection: 5
  water_protection: 5
  contaminated_v2: 6
  contaminated_v1: 3
  marine_shipping: 6
  marine_renewables: 8
  marine_materials: 6
  marine_cable_corridor: 1
  offshore_wind_planned: 7
  munitions_points: 8
  subsea_pipelines: 4
  subsea_cables: 5
  beach_protection: 7
  fredskov: 7
  dwelling_proximity:
    enabled: true
    max_distance_m: 200
    max_score: 6
  population:
    enabled: true
    min_per_cell: 1.0  # people per 100 m source cell; scales with analysis-cell area
    minimum: 1
    maximum: 10
    quantiles: 100

rasterization:
  # Linear features are burned into every touched cell to prevent diagonal gaps.
  linear_all_touched: true
  polygon_all_touched: false

layers:
  roads_major:
    file: phase_a_infrastructure.gpkg
    layer: roads_major
    cost: road_major
    class_bit: road_major
    geometry: linear
    parallel_asset: true
  roads_minor:
    file: phase_a_infrastructure.gpkg
    layer: roads_minor
    cost: road_minor
    class_bit: road_minor
    geometry: linear
  railways:
    file: infrastructure.gpkg
    layer: railways
    cost: railway_crossing
    geometry: linear
    parallel_asset: true
  watercourses:
    file: infrastructure.gpkg
    layer: watercourses
    cost: watercourse_crossing
    geometry: linear
    surface: land
  urban_areas:
    file: water_and_urban.gpkg
    layer: urban_areas
    cost: urban_area
    geometry: polygon
  forest:
    file: phase_a_infrastructure.gpkg
    layer: forest
    cost: forest
    geometry: polygon
    surface: land
  lakes:
    file: water_and_urban.gpkg
    layer: lakes
    cost: lake
    geometry: polygon
    surface: land
  wetlands:
    file: water_and_urban.gpkg
    layer: wetlands
    cost: wetland
    geometry: polygon
